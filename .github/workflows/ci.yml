name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check

  migrate:
    # Applies committed migrations to production after a merge to main. It runs
    # alongside the Vercel deploy, so keep migrations expand-only: add tables
    # and columns before code depends on them, and drop them only after.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    concurrency: migrate-production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Until a production database exists, a missing secret only warns, so
      # main stays green. db:migrate never seeds or resets a remote database.
      - if: env.DATABASE_URL == ''
        run: echo "::warning::The DATABASE_URL secret is not set; skipped migrations."
      - if: env.DATABASE_URL != ''
        run: bun run db:migrate
